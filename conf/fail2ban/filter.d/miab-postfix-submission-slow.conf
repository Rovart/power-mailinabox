# Failed logins on the submission ports (465 and 587), for the miab-postfix-slow jail.
# Unlike miab-postfix-submission, aborted logins don't count, nor failures caused by
# Dovecot's authentication service being unavailable (e.g. while it restarts).
[INCLUDES]

before = common.conf

[Definition]
failregex = postfix/submission/smtpd.*warning: [^\[]*\[<HOST>\]: SASL \S+ authentication failed
ignoreregex = authentication failed: (Connection lost to authentication server|.*[Tt]emporary failure)
