# Fail2Ban configuration file for Mail-in-a-Box. Do not edit.
# This file is re-generated on updates.

[DEFAULT]
# Whitelist our own IP addresses. 127.0.0.1/8 is the default. But our status checks
# ping services over the public interface so we should whitelist that address of
# ours too. The string is substituted during installation.
ignoreip = 127.0.0.1/8 PUBLIC_IP ::1 PUBLIC_IPV6

[dovecot]
enabled = true
filter  = dovecotimap
logpath = /var/log/mail.log
findtime = 30
maxretry = 20

[miab-management]
enabled = true
filter = miab-management-daemon
port = http,https
logpath = /var/log/syslog
maxretry = 20
findtime = 30

[miab-munin]
enabled  = true
port     = http,https
filter   = miab-munin
logpath  = /var/log/nginx/access.log
maxretry = 20
findtime = 30

[miab-owncloud]
enabled  = true
port     = http,https
filter   = miab-owncloud
logpath  = STORAGE_ROOT/owncloud/nextcloud.log
maxretry = 20
findtime = 120

[miab-postfix465]
enabled  = true
port     = 465
filter   = miab-postfix-submission
logpath  = /var/log/mail.log
maxretry = 20
findtime = 30

[miab-postfix587]
enabled  = true
port     = 587
filter   = miab-postfix-submission
logpath  = /var/log/mail.log
maxretry = 20
findtime = 30

# Slow password guessing on the submission ports. The two jails above catch fast
# attacks (20 failures in 30 seconds), but botnets now try a few passwords per IP
# address, hours apart, from thousands of addresses. This one bans an address from
# ports 465 and 587 (only) for a day after 10 failed logins in a day. Only real
# failures count, not aborted logins (some mail clients abort when they try a
# mechanism the server doesn't offer) nor failures because Dovecot was restarting
# (see the filter). Addresses that logged in successfully in the last 30 days are
# never banned: management/login_alerts.py adds them to this jail's ignore list.
# To lift a ban: fail2ban-client set miab-postfix-slow unbanip <address>
[miab-postfix-slow]
enabled  = true
port     = 465,587
filter   = miab-postfix-submission-slow
logpath  = /var/log/mail.log
maxretry = 10
findtime = 1d
bantime  = 1d

[miab-roundcube]
enabled  = true
port     = http,https
filter   = miab-roundcube
logpath  = /var/log/roundcubemail/errors.log
maxretry = 20
findtime = 30

[recidive]
enabled  = true
maxretry = 10
action   = iptables-allports[name=recidive]
# In the recidive section of jail.conf the action contains:
#
# action   = iptables-allports[name=recidive]
#            sendmail-whois-lines[name=recidive, logpath=/var/log/fail2ban.log]
#
# The last line on the action will sent an email to the configured address. This mail will
# notify the administrator that someone has been repeatedly triggering one of the other jails.
# By default we don't configure this address and no action is required from the admin anyway.
# So the notification is ommited. This will prevent message appearing in the mail.log that mail
# can't be delivered to fail2ban@$HOSTNAME.

[postfix-sasl]
enabled  = true

[sshd]
enabled = true
maxretry = 7
bantime = 3600
